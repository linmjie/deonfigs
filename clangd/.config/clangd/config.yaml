# This file was generated by Qt Creator and will be overwritten unless you remove this line.
Hover:
  ShowAKA: Yes
Diagnostics:
  UnusedIncludes: Strict

---
If:
  PathMatch: [.*\.c$]
CompileFlags:
  Add: [
    -Wall, -Wextra
    -Wno-unused-parameter
  ]

---
If:
  PathMatch: [.*\.(cpp|hpp|cc|cxx|hxx)$]
CompileFlags:
  Add: [
    -std=c++20,
    -Wall, -Wextra
    -Wno-unused-parameter
  ]
