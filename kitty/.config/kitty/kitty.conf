# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

shell_integration no-cursor no-title

remember_window_size no
initial_window_width 120c
initial_window_height 40c

# BEGIN_KITTY_FONTS
font_family      family="RobotoMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12.0
# END_KITTY_FONTS
